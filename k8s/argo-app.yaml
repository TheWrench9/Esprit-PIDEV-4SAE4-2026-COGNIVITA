apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cognivita
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TheWrench9/Esprit-PIDEV-4SAE4-2026-COGNIVITA
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: cognivita
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
